name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Edge Function
        run: deno check supabase/functions/generate-roadmap/index.ts

      - name: Edge Function validation tests
        run: deno test supabase/functions/_shared/roadmap_test.ts

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
