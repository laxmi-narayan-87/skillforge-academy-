name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Audit full dependency tree
        run: npm audit --audit-level=high

      - name: Setup Deno
        uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: v2.x

      - name: Type-check Edge Function
        run: deno check supabase/functions/generate-roadmap/index.ts

      - name: Edge Function validation tests
        run: deno test supabase/functions/_shared/roadmap_test.ts

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
